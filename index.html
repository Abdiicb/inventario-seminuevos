<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia Ruta 66 - Seminuevos</title>
    <style>
        /* Estilos generales */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background-color: #1a252f; 
            color: white; 
            padding: 20px; 
            text-align: center; 
        }
        .busqueda-container {
            text-align: center;
            margin: 20px;
        }
        #buscador {
            padding: 12px;
            width: 80%;
            max-width: 400px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #inventario-container { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center;
            padding: 20px;
        }
        .tarjeta-auto { 
            background-color: white;
            border: 1px solid #ddd; 
            border-radius: 8px; 
            width: 300px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .tarjeta-auto:hover {
            transform: scale(1.02);
        }
        .tarjeta-auto img { 
            width: 100%; 
            height: 200px;
            object-fit: cover; 
        }
        .info-auto {
            padding: 15px;
        }
        .info-auto h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #333;
        }
        .info-auto p {
            margin: 5px 0;
            color: #555;
        }
        .precio {
            font-size: 1.2em;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <header>
        <h1>Agencia Ruta 66</h1>
        <p>Los mejores seminuevos garantizados</p>
    </header>
    
    <div class="busqueda-container">
        <!-- El input donde el usuario escribirá la marca o modelo -->
        <input type="text" id="buscador" placeholder="Buscar por marca o modelo (ej. Ford, Civic)...">
    </div>

    <!-- Aquí es donde JavaScript insertará las tarjetas -->
    <div id="inventario-container"></div>

    <script src="app.js"></script>
</body>
</html>
