<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia Ruta 66 - Seminuevos</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background-color: #1a252f; 
            color: white; 
            padding: 20px; 
            text-align: center; 
        }
        .busqueda-container {
            text-align: center;
            margin: 20px;
        }
        #buscador {
            padding: 12px;
            width: 80%;
            max-width: 400px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #inventario-container { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center;
            padding: 20px;
        }
        .tarjeta-auto { 
            background-color: white;
            border: 1px solid #ddd; 
            border-radius: 8px; 
            width: 320px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .tarjeta-auto:hover {
            transform: scale(1.01);
        }

       
        .carrusel-contenedor {
            position: relative; 
        }
        .carrusel {
            display: flex;
            overflow-x: hidden; 
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        .carrusel img { 
            scroll-snap-align: center; 
            flex: 0 0 100%; 
            height: 220px;
            object-fit: cover; 
            background-color: #e9e9e9;
        }
        .btn-carrusel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            font-size: 16px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%; 
            transition: background 0.3s;
        }
        .btn-carrusel:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .btn-carrusel.izq {
            left: 10px;
        }
        .btn-carrusel.der {
            right: 10px;
        }
        /* ---------------------------------- */

        .info-auto {
            padding: 15px;
        }
        .info-auto h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #1a252f;
            text-transform: uppercase;
        }
        .proveedor {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .info-auto p {
            margin: 5px 0;
            color: #444;
            font-size: 14px;
        }
        .precio {
            font-size: 1.3em !important;
            font-weight: bold;
            color: #27ae60 !important;
            margin: 10px 0 !important;
        }
        
        .ver-mas {
            margin-top: 15px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
        .ver-mas summary {
            cursor: pointer;
            color: #2980b9;
            font-weight: bold;
            outline: none;
            list-style: none;
            text-align: center;
            padding: 5px;
        }
        .ver-mas summary::-webkit-details-marker {
            display: none;
        }
        .ver-mas summary::after {
            content: " ▼";
            font-size: 11px;
        }
        .ver-mas[open] summary::after {
            content: " ▲";
        }
        .detalles-extra {
            margin-top: 10px;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #eee;
        }
        .detalles-extra p {
            margin: 4px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Agencia Ruta 66</h1>
        <p>INVENTARIO</p>
    </header>
    
    <div class="busqueda-container">
        <input type="text" id="buscador" placeholder="Buscar por marca o modelo (ej. Ford, Civic)...">
    </div>

    <div id="inventario-container"></div>

    <script src="app.js"></script>
</body>
</html>
